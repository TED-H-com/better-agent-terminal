name: PM server candidate package

on:
  pull_request:
    paths:
      - '.github/workflows/pm-server-package.yml'
      - 'scripts/pm-server-*.py'
      - 'scripts/build-bat-server-bundle.mjs'
      - 'scripts/*tauri*runtime*.mjs'
      - 'scripts/*tauri*sidecar*.mjs'
      - 'scripts/fetch-node-runtime.mjs'
      - 'docs/pm-server-candidate.md'
      - 'src-tauri/**'
      - 'node-sidecar/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'runtime-catalog.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-server-package-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux x86_64 producer package
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record source and use disk scratch
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/pm-package" "$RUNNER_TEMP/pm-target"
          for path in "$RUNNER_TEMP/pm-package" "$RUNNER_TEMP/pm-target"; do
            case "$(stat -f -c %T "$path")" in tmpfs|ramfs) exit 1 ;; esac
          done
          printf 'TMPDIR=%s\nCARGO_TARGET_DIR=%s\n' \
            "$RUNNER_TEMP/pm-package" "$RUNNER_TEMP/pm-target" >> "$GITHUB_ENV"
          printf 'Source: `%s`\n' "$EXPECTED_SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.33.2'
          run_install: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.1'
          targets: x86_64-unknown-linux-musl
      - name: Prepare locked resources
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools build-essential pkg-config python3 git ca-certificates
          pnpm install --frozen-lockfile
          pnpm --dir node-sidecar install --frozen-lockfile
          pnpm exec tsc --noEmit --pretty false
          pnpm run compile
          node scripts/fetch-node-runtime.mjs --target=linux-x86_64
          pnpm run build:tauri-sidecar
          pnpm run prune:tauri-sidecar
          pnpm run prepare:tauri-sidecar-node-modules
          pnpm run prepare:tauri-codex-runtime
      - name: Build fixed headless producer
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            --bin bat-server --no-default-features --features headless \
            --manifest-path src-tauri/Cargo.toml
          binary="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/bat-server"
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
          node scripts/build-bat-server-bundle.mjs --bin "$binary" \
            --target linux-x86_64 --out "$RUNNER_TEMP/pm-bundle"
      - name: Seal source, prerequisites and checksums
        run: python3 scripts/pm-server-package.py --bundle "$RUNNER_TEMP/pm-bundle/bat-server-linux-x86_64" --output "$RUNNER_TEMP/pm-delivery"
      - name: Exercise extracted package and restart readback
        run: python3 scripts/pm-server-smoke.py --delivery "$RUNNER_TEMP/pm-delivery" --scratch "$TMPDIR"
      - name: Require unchanged tracked source
        run: git diff --exit-code HEAD
      - name: Retain candidate and package evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bat-pm-server-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pm-delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
