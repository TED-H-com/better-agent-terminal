name: Dependency regression checks

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - node-sidecar/package.json
      - node-sidecar/pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/vendor/**
      - scripts/verify-vendored-glib.py
      - .github/workflows/dependency-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.2"
          run_install: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.98.1"
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          pnpm install --frozen-lockfile
          pnpm --dir node-sidecar install --frozen-lockfile
      - name: Check renderer and sidecar compatibility
        run: |
          pnpm exec tsc --noEmit --pretty false
          pnpm run compile
          pnpm run test:sidecar
          pnpm run test:chat-markdown
          pnpm run build:tauri-sidecar
      - name: Exercise optimized GLib iterator implementation
        run: |
          python3 scripts/verify-vendored-glib.py
          glib_test_dir=$(mktemp -d "$RUNNER_TEMP/glib-regression.XXXXXX")
          cp -R src-tauri/vendor/glib-0.18.5/. "$glib_test_dir/"
          cargo test --manifest-path "$glib_test_dir/Cargo.toml" --release --lib variant_iter::tests
      - name: Check the GTK desktop dependency graph
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked
